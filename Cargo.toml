[package]
name = "concord-backend"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["json", "query"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tower-http = { version = "0.6.11", features = ["trace", "cors"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "bigdecimal", "migrate"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0.69"
anyhow = "1.0"
jsonwebtoken = "9.3.1"
ed25519-dalek = "2.2.0"
stellar-strkey = "0.0.18"
stellar-xdr = { version = "27.0.0", features = ["std", "base64"] }
reqwest = { version = "0.11.27", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
bigdecimal = { version = "0.4", features = ["serde"] }
rand = "0.8.8"
hex = "0.4.3"
hmac = "0.12.1"
sha2 = "0.10.9"
base64 = "0.22.1"
dotenvy = "0.15.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
sqlx = { version = "0.8.6", features = ["macros"] }
http-body-util = "0.1"
